name: Zero-test guard self-test

on:
  push:
    branches: [dev-atomica]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_CLASS: sanity-meta

jobs:
  guard-selftest:
    name: Zero-test guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - run: .github/scripts/tests/selftest.sh

