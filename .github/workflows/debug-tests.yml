name: Debug Smoke Tests

on:
  push:
    branches:
      - main
      - dev-atomica
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
      - dev-atomica
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.94.1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  RUST_MIN_STACK: 104857600

jobs:
  debug-tests:
    name: Debug Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned, matches rust-toolchain.toml)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            libssl-dev \
            pkg-config \
            libpq-dev \
            lld \
            libudev-dev \
            libdw-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: "atomica-test"
          cache-on-failure: true
          cache-all-crates: true
          workspaces: "."
          add-job-id-key: false
          # Always save cache to update with newly built artifacts
          save-if: true

      - name: Build aptos-node
        run: |
          cargo build -p aptos-node --features=failpoints,smoke-test
        timeout-minutes: 60

      # `if: always()` lets every smoke test report, and each is guarded so a
      # filter that matches nothing fails instead of passing with zero tests.
      - name: Run test_basic_client
        if: always()
        run: .github/scripts/run-tests-guarded.sh test_basic_client 1 -- cargo test -p smoke-test --lib rest_api::test_basic_client -- --nocapture --test-threads=1
        timeout-minutes: 60

      - name: Run randomness_correctness
        if: always()
        run: .github/scripts/run-tests-guarded.sh randomness_correctness 1 -- cargo test -p smoke-test --lib randomness_correctness -- --nocapture --test-threads=1
        timeout-minutes: 60

      - name: Run test_validator_execution_sync_epoch_changes
        if: always()
        run: .github/scripts/run-tests-guarded.sh state_sync_epoch_changes 1 -- cargo test -p smoke-test --lib state_sync::test_validator_execution_sync_epoch_changes -- --nocapture --test-threads=1
        timeout-minutes: 60

      # Swarm logs are kept when a test panics. Print the DKG and error lines
      # so a failure can be diagnosed from the job log.
      - name: Print swarm node log excerpts
        if: failure()
        run: |
          for d in "${TMPDIR:-/tmp}"/.tmp*; do
            [ -d "$d" ] || continue
            for f in $(find "$d" -name log -type f | sort | head -8); do
              echo "=== $f ($(wc -l < "$f") lines)"
              grep -iE "dkg|timelock|ibe|chunky|ERROR|panic" "$f" | tail -25 | cut -c1-400
            done
          done
