name: Build Validator Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Binary release tag (e.g., binary-80cf17c75e)"
        required: false
        type: string
      force_rebuild:
        description: "Force rebuild even if image exists"
        required: false
        type: boolean
        default: false

env:
  # Release plumbing: builds and publishes the validator image, runs no tests.
  CI_CLASS: ignore
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/validator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: release-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            # Manual workflow_dispatch with explicit release tag
            RELEASE_TAG="$INPUT_TAG"
            echo "Using manual release tag: $RELEASE_TAG"
          elif [ "${{ github.event_name }}" = "release" ]; then
            # Triggered by release event
            RELEASE_TAG="$EVENT_TAG"
            echo "Using release event tag: $RELEASE_TAG"
          else
            # Workflow dispatch without tag - fetch latest
            echo "No release tag provided, fetching latest release..."
            RELEASE_TAG=$(gh release view --json tagName --jq .tagName)
            if [ -z "$RELEASE_TAG" ]; then
               echo "Error: Could not determine latest release tag"
               exit 1
            fi
            echo "Using latest release tag: $RELEASE_TAG"
          fi

          # Validate format: binary-<sha>
          if [[ ! "$RELEASE_TAG" =~ ^binary-[a-f0-9]+$ ]]; then
            echo "Error: Invalid release tag format: $RELEASE_TAG"
            echo "Expected format: binary-<commit-sha> (e.g., binary-80cf17c75e)"
            exit 1
          fi

          # Extract git SHA from tag (remove 'binary-' prefix)
          GIT_SHA="${RELEASE_TAG#binary-}"

          # Resolve the binary's full commit. The image revision label must name it,
          # not the commit this workflow runs from.
          GIT_SHA_FULL=$(git rev-parse --verify --quiet "${GIT_SHA}^{commit}" || true)
          if [ -z "$GIT_SHA_FULL" ]; then
            echo "Error: binary commit $GIT_SHA does not resolve to one commit in this repository"
            exit 1
          fi

          # Binaries before the first release build without the `testing` feature (7153ddc5cd)
          # carry Move test natives, but the Dockerfile labels the image test-natives=false.
          FIRST_RELEASE_BUILD=7153ddc5cdba1d7aa357bfe8cb285fdcbe629179
          if ! git merge-base --is-ancestor "$FIRST_RELEASE_BUILD" "$GIT_SHA_FULL"; then
            echo "Error: $RELEASE_TAG was built before $FIRST_RELEASE_BUILD and may contain Move test natives"
            echo "Cut a new binary release from dev-atomica and build the image from that."
            exit 1
          fi

          # Tag `latest` only for a full release. On workflow_dispatch there is no release
          # payload, so read the flag from the release itself.
          if [ "${{ github.event_name }}" = "release" ]; then
            PRERELEASE="${{ github.event.release.prerelease }}"
          else
            PRERELEASE=$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" --jq .prerelease)
          fi
          if [ "$PRERELEASE" != "true" ] && [ "$PRERELEASE" != "false" ]; then
            echo "Error: could not determine whether $RELEASE_TAG is a pre-release (got '$PRERELEASE')"
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "sha=$GIT_SHA" >> $GITHUB_OUTPUT
          echo "sha_full=$GIT_SHA_FULL" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "Release tag: $RELEASE_TAG"
          echo "Git SHA: $GIT_SHA (full: $GIT_SHA_FULL)"
          echo "Pre-release: $PRERELEASE"

      - name: Get Dockerfile hash
        id: dockerfile-hash
        run: |
          DOCKERFILE_HASH=$(sha256sum atomica/docker/Dockerfile | cut -c1-8)
          echo "hash=$DOCKERFILE_HASH" >> $GITHUB_OUTPUT
          echo "Dockerfile hash: $DOCKERFILE_HASH"

      - name: Verify binary release exists
        id: check-binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.release-info.outputs.tag }}"
          BINARY_NAME="aptos-node-${{ steps.release-info.outputs.sha }}"
          FAUCET_BINARY_NAME="aptos-faucet-service-${{ steps.release-info.outputs.sha }}"

          echo "Checking for binary '$BINARY_NAME' and '$FAUCET_BINARY_NAME' in release '$RELEASE_TAG'"

          # Use GitHub API to check if asset exists in release
          ASSET_CHECK=$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq ".assets[] | select(.name == \"${BINARY_NAME}\" or .name == \"${FAUCET_BINARY_NAME}\") | .name" || echo "")

          # Should find at least 2 binaries (node and faucet)
          BINARY_COUNT=$(echo "$ASSET_CHECK" | wc -l)

          if [ "$BINARY_COUNT" -ge 2 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✓ Binary release found: $RELEASE_TAG"
            echo "✓ Assets found: $BINARY_COUNT"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✗ Binary release missing required assets"
            echo "  Release: $RELEASE_TAG"
            echo "  Expected assets: $BINARY_NAME, $FAUCET_BINARY_NAME"
            echo "  Found: $ASSET_CHECK"
          fi

      - name: Fail if binary not found
        if: steps.check-binary.outputs.exists == 'false'
        run: |
          echo "ERROR: Binary release not found"
          echo "Release tag: ${{ steps.release-info.outputs.tag }}"
          echo "Expected binary: aptos-node-${{ steps.release-info.outputs.sha }}"
          echo ""
          echo "The Docker image build requires a prebuilt binary from GitHub releases."
          echo ""
          echo "Please verify:"
          echo "1. The release '${{ steps.release-info.outputs.tag }}' exists"
          echo "2. The release contains 'aptos-node-${{ steps.release-info.outputs.sha }}'"
          echo "3. View releases: https://github.com/${{ github.repository }}/releases"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Download binaries from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.release-info.outputs.tag }}"
          GIT_SHA="${{ steps.release-info.outputs.sha }}"

          echo "Downloading binaries from release: $RELEASE_TAG"

          # Download binaries, framework, and checksums
          gh release download "$RELEASE_TAG" \
            --pattern "aptos-node-${GIT_SHA}" \
            --pattern "aptos-node-${GIT_SHA}.sha256" \
            --pattern "aptos-${GIT_SHA}" \
            --pattern "aptos-${GIT_SHA}.sha256" \
            --pattern "aptos-faucet-service-${GIT_SHA}" \
            --pattern "aptos-faucet-service-${GIT_SHA}.sha256" \
            --pattern "framework-*.mrb" \
            --pattern "framework-*.mrb.sha256" \
            --dir ./atomica/docker/binaries

          # Verify checksums
          cd ./atomica/docker/binaries
          sha256sum -c "aptos-node-${GIT_SHA}.sha256"
          sha256sum -c "aptos-${GIT_SHA}.sha256"
          sha256sum -c "aptos-faucet-service-${GIT_SHA}.sha256"
          sha256sum -c framework-*.mrb.sha256

          # Make binaries executable
          chmod +x "aptos-node-${GIT_SHA}"
          chmod +x "aptos-${GIT_SHA}"
          chmod +x "aptos-faucet-service-${GIT_SHA}"

          echo "✓ Binaries and framework downloaded and verified"
          ls -lh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release-info.outputs.sha }}-${{ steps.dockerfile-hash.outputs.hash }}
            type=raw,value=${{ steps.release-info.outputs.sha }}
            type=raw,value=${{ steps.release-info.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release-info.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release-info.outputs.sha_full }}
            org.opencontainers.image.version=${{ steps.release-info.outputs.tag }}

      - name: Check if image exists
        id: check-image
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release-info.outputs.sha }}-${{ steps.dockerfile-hash.outputs.hash }}"

          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Force rebuild requested - will build: $IMAGE_TAG"
          elif docker manifest inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image already exists: $IMAGE_TAG"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image does not exist, will build: $IMAGE_TAG"
          fi

      - name: Build and push Docker image
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/build-push-action@v5.4.0
        with:
          context: .
          file: atomica/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.created }}
            GIT_SHA=${{ steps.release-info.outputs.sha }}
            BINARY_RELEASE_TAG=${{ steps.release-info.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image already exists (skip build)
        if: steps.check-image.outputs.exists == 'true'
        run: |
          echo "Image already exists:"
          echo "  Release: ${{ steps.release-info.outputs.tag }}"
          echo "  Git SHA: ${{ steps.release-info.outputs.sha }}"
          echo "  Dockerfile hash: ${{ steps.dockerfile-hash.outputs.hash }}"
          echo "  Tag: ${{ steps.release-info.outputs.sha }}-${{ steps.dockerfile-hash.outputs.hash }}"
          echo ""
          echo "Skipping build to save CI time"
          echo ""
          echo "To force rebuild, use workflow_dispatch with force_rebuild=true"

      - name: Output image tags
        run: |
          echo "Built images:"
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            echo "  - $tag"
          done

      - name: Verify image
        if: steps.check-image.outputs.exists == 'false'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release-info.outputs.sha }}-${{ steps.dockerfile-hash.outputs.hash }}"
          echo "Verifying image: $IMAGE"
          echo "Testing aptos-node binary:"
          docker run --rm --entrypoint /usr/local/bin/aptos-node "$IMAGE" --version
          echo "Testing aptos CLI binary:"
          docker run --rm --entrypoint /usr/local/bin/aptos "$IMAGE" --version

      - name: Verify image revision label and latest tag
        # Runs whether or not this run built the image, so a reused image is checked too.
        env:
          EXPECTED_REVISION: ${{ steps.release-info.outputs.sha_full }}
          PRERELEASE: ${{ steps.release-info.outputs.prerelease }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release-info.outputs.sha }}-${{ steps.dockerfile-hash.outputs.hash }}"
          docker pull "$IMAGE"
          REVISION=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")
          echo "Revision label: $REVISION"
          if [ "$REVISION" != "$EXPECTED_REVISION" ]; then
            echo "Error: revision label is '$REVISION', expected the binary commit $EXPECTED_REVISION"
            echo "If this image was built before the label fix, rerun with force_rebuild=true."
            exit 1
          fi

          if [ "$PRERELEASE" = "true" ]; then
            IMAGE_DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{ json .Manifest }}' | jq -r .digest)
            LATEST_DIGEST=$(docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
              --format '{{ json .Manifest }}' 2>/dev/null | jq -r .digest || true)
            echo "Image digest: $IMAGE_DIGEST"
            echo "latest digest: ${LATEST_DIGEST:-<none>}"
            if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "null" ]; then
              echo "Error: could not read the image digest"
              exit 1
            fi
            if [ "$LATEST_DIGEST" = "$IMAGE_DIGEST" ]; then
              echo "Error: latest points at this pre-release image"
              exit 1
            fi
          fi
