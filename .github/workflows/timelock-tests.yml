name: Timelock Tests

# Two jobs:
#
# - `timelock`: the standalone FPTX timelock prototype (atomica/proto-fptx-timelock).
#   It is a reference only: superseded for the product path by
#   atomica/docs/decisions/aptos-upgrade-ibe-chunky-spec.md. It is not a
#   workspace member and does not build aptos-node, so it costs little and keeps
#   the reference and the review packet evidence reproducible. Remove that job
#   when the prototype folder is deleted.
# - `timelock-share-vm`: the `TimelockShare` validator transaction through
#   AptosVM against the real framework (e2e-move-tests timelock_share), including
#   the multi-validator reveals below full weight. It runs when the timelock
#   registry, the IBE natives, the handler, the IBE crate or the cached framework
#   bundle (the harness runs genesis from head.mrb) change.

on:
  push:
    branches:
      - dev-atomica
    paths:
      - "atomica/proto-fptx-timelock/**"
      - "aptos-move/framework/aptos-framework/sources/ibe_config.move"
      - "aptos-move/framework/aptos-stdlib/sources/cryptography/ibe.move"
      - "aptos-move/framework/natives/src/timelock.rs"
      - "aptos-move/framework/cached-packages/src/head.mrb"
      - "aptos-move/aptos-vm/src/validator_txns/**"
      - "aptos-move/e2e-move-tests/src/tests/timelock_share.rs"
      - "crates/aptos-dkg/src/ibe/**"
      - ".github/workflows/timelock-tests.yml"
      - ".github/scripts/**"
  pull_request:
    branches:
      - dev-atomica
    paths:
      - "atomica/proto-fptx-timelock/**"
      - "aptos-move/framework/aptos-framework/sources/ibe_config.move"
      - "aptos-move/framework/aptos-stdlib/sources/cryptography/ibe.move"
      - "aptos-move/framework/natives/src/timelock.rs"
      - "aptos-move/framework/cached-packages/src/head.mrb"
      - "aptos-move/aptos-vm/src/validator_txns/**"
      - "aptos-move/e2e-move-tests/src/tests/timelock_share.rs"
      - "crates/aptos-dkg/src/ibe/**"
      - ".github/workflows/timelock-tests.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.94.1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  timelock:
    name: Timelock crate tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: atomica/proto-fptx-timelock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain (pinned, matches rust-toolchain.toml)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy -c rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: "atomica/proto-fptx-timelock -> target"
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt -- --check

      # Local run on 2026-10-30 collected and executed 11 tests, so 11 is the floor.
      - name: Run timelock tests (zero-test guard, minimum 11)
        run: ../../.github/scripts/run-tests-guarded.sh timelock 11 -- cargo test --locked

  timelock-share-vm:
    name: TimelockShare VM tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 104857600
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain (pinned, matches rust-toolchain.toml)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libssl-dev pkg-config libpq-dev lld libudev-dev libdw-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: "atomica-test"
          cache-on-failure: true
          cache-all-crates: true
          workspaces: "."
          add-job-id-key: false
          save-if: true

      # 9 tests on 2026-11-04 (7 handler tests, plus the two multi-validator reveals below full
      # weight: equal weights 1,1,1,1 in order 2,0,3 and unequal weights 2,1,1 in order 2,0), so 9 is the floor.
      - name: Run timelock_share VM tests (zero-test guard, minimum 9)
        run: |
          .github/scripts/run-tests-guarded.sh timelock_share 9 -- cargo test --locked -p e2e-move-tests --lib timelock_share:: -- --test-threads=1
