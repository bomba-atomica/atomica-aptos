name: Lint & Format

on:
  push:
    branches:
      - main
      - dev-atomica
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - "rustfmt.toml"
      - "clippy.toml"
  pull_request:
    branches:
      - main
      - dev-atomica
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - "rustfmt.toml"
      - "clippy.toml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CLASS: code-hygiene
  RUST_TOOLCHAIN: "1.94.1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reduce memory pressure during builds
  CARGO_BUILD_JOBS: 2
  # Disable incremental compilation (not useful in CI and uses extra disk space)
  CARGO_INCREMENTAL: 0

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # rustfmt.toml uses nightly-only options, so formatting must run on nightly
      # (same as upstream scripts/rust_lint.sh). Clippy and builds stay on the pin.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal -c rustfmt

      - name: Check formatting
        run: |
          echo "Checking code formatting..."
          cargo +nightly fmt -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          actionlint_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$actionlint_dir"
          release_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$release_url/$archive" -o "$actionlint_dir/$archive"
          curl -fsSL "$release_url/actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            -o "$actionlint_dir/checksums.txt"
          grep -F " $archive" "$actionlint_dir/checksums.txt" \
            > "$actionlint_dir/checksum.txt"
          (cd "$actionlint_dir" && sha256sum -c checksum.txt)
          tar -xzf "$actionlint_dir/$archive" -C "$actionlint_dir" actionlint
          echo "$actionlint_dir" >> "$GITHUB_PATH"

      - name: Lint release workflows
        run: |
          actionlint -no-color \
            .github/workflows/build-aptos-binary.yml \
            .github/workflows/build-validator-image.yml

      - name: Check release dispatch guard
        run: |
          set -euo pipefail
          bash atomica/scripts/check-release-dispatch.sh

          mutated_workflow="$RUNNER_TEMP/build-aptos-binary-without-dispatch.yml"
          awk '
            /^  dispatch-validator-image:$/ { skip = 1; next }
            skip && /^  [A-Za-z0-9_-]+:$/ { skip = 0 }
            !skip { print }
          ' .github/workflows/build-aptos-binary.yml > "$mutated_workflow"

          failure_output="$RUNNER_TEMP/check-release-dispatch-negative.log"
          if bash atomica/scripts/check-release-dispatch.sh "$mutated_workflow" \
            > "$failure_output" 2>&1; then
            cat "$failure_output"
            echo "The dispatch guard passed after its dispatch job was removed" >&2
            exit 1
          fi
          grep -Fq 'dispatch-validator-image job is missing' "$failure_output"
          echo "The dispatch guard rejected a workflow with its dispatch job removed"

          event_gated_workflow="$RUNNER_TEMP/build-aptos-binary-gated-on-release.yml"
          awk '
            /^    if: github.ref == '\''refs\/heads\/dev-atomica'\''$/ {
              print "    if: github.ref == '\''refs/heads/dev-atomica'\'' && github.event_name == '\''release'\''"
              next
            }
            { print }
          ' .github/workflows/build-aptos-binary.yml > "$event_gated_workflow"

          failure_output="$RUNNER_TEMP/check-release-dispatch-event-negative.log"
          if bash atomica/scripts/check-release-dispatch.sh "$event_gated_workflow" \
            > "$failure_output" 2>&1; then
            cat "$failure_output"
            echo "The dispatch guard passed after a release-only event condition was added" >&2
            exit 1
          fi
          grep -Fq 'image dispatch job condition must be exactly the dev-atomica ref guard' "$failure_output"
          echo "The dispatch guard rejected a job condition that excludes push and workflow_dispatch"

          image_without_release="$RUNNER_TEMP/build-validator-image-without-release.yml"
          awk '
            /^  release:$/ { skip = 1; next }
            skip && /^  [A-Za-z0-9_-]+:$/ { skip = 0 }
            !skip { print }
          ' .github/workflows/build-validator-image.yml > "$image_without_release"

          failure_output="$RUNNER_TEMP/check-release-trigger-negative.log"
          if bash atomica/scripts/check-release-dispatch.sh \
            .github/workflows/build-aptos-binary.yml "$image_without_release" \
            > "$failure_output" 2>&1; then
            cat "$failure_output"
            echo "The dispatch guard passed after the validator release trigger was removed" >&2
            exit 1
          fi
          grep -Fq 'validator image workflow lost release event' "$failure_output"
          echo "The dispatch guard rejected a validator workflow with its release trigger removed"

          workflow_without_repo="$RUNNER_TEMP/build-aptos-binary-without-repo-context.yml"
          awk '!/--repo "\$GITHUB_REPOSITORY"/' \
            .github/workflows/build-aptos-binary.yml > "$workflow_without_repo"

          failure_output="$RUNNER_TEMP/check-release-dispatch-repo-negative.log"
          if bash atomica/scripts/check-release-dispatch.sh "$workflow_without_repo" \
            > "$failure_output" 2>&1; then
            cat "$failure_output"
            echo "The dispatch guard passed after the repository context was removed" >&2
            exit 1
          fi
          grep -Fq 'image dispatch job does not provide explicit repository context' "$failure_output"
          echo "The dispatch guard rejected a workflow dispatch without explicit repository context"

      - name: Install Rust toolchain (pinned, matches rust-toolchain.toml)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            libssl-dev \
            pkg-config \
            libpq-dev \
            lld \
            libudev-dev \
            libdw-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: "atomica-test"
          cache-on-failure: true
          cache-all-crates: true
          workspaces: "."
          add-job-id-key: false
          # Always save cache to update with newly built artifacts
          save-if: true

      - name: Run Clippy
        run: |
          echo "Running Clippy lints with xclippy..."
          cargo xclippy
