name: Crypto Crates Tests

on:
  push:
    branches:
      - dev-atomica
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev-atomica

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.94.1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  RUST_MIN_STACK: 104857600

jobs:
  guard-selftest:
    name: Zero-test guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - run: .github/scripts/tests/selftest.sh

  crypto-crates:
    name: Crypto Crates Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned, matches rust-toolchain.toml)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            libssl-dev \
            pkg-config \
            libpq-dev \
            lld \
            libudev-dev \
            libdw-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: "crypto-crates"
          cache-on-failure: true
          cache-all-crates: true
          workspaces: "."
          add-job-id-key: false
          # Always save cache to update with newly built artifacts
          save-if: true

      # Every step goes through the guard: a step that runs zero tests fails.
      - name: Run aptos-dkg tests
        run: .github/scripts/run-tests-guarded.sh aptos-dkg 10 -- cargo test -p aptos-dkg --verbose

      - name: Run aptos-crypto tests
        run: .github/scripts/run-tests-guarded.sh aptos-crypto 10 -- cargo test -p aptos-crypto --verbose

      - name: Run aptos-types tests
        run: .github/scripts/run-tests-guarded.sh aptos-types 10 -- cargo test -p aptos-types --verbose
