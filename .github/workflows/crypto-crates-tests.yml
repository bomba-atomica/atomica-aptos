name: Crypto Crates Tests

on:
  push:
    branches:
      - timelock-das-vpss
  pull_request:
    branches:
      - dev-atomica
      - timelock-das-vpss

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  aptos-dkg:
    name: aptos-dkg tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils lld cmake clang libssl-dev pkg-config libudev-dev libdw-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "crypto-crates"
          cache-on-failure: true

      - name: Run aptos-dkg tests
        run: cargo test -p aptos-dkg --verbose

  aptos-crypto:
