name: Crypto Crates Tests

on:
  push:
    branches:
      - dev-atomica
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  crypto-crates-tests:
    runs-on: runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Run dev_setup.sh
        run: scripts/dev_setup.sh -b -y

      - name: Run crypto crates tests
        run: cargo nextest run --profile ci --cargo-profile ci --locked -p aptos-crypto -p aptos-crypto-derive --retries 3 --no-fail-fast
        env:
          RUST_MIN_STACK: "4297152"
