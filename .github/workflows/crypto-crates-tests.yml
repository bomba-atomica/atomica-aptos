name: Crypto Crates Tests

on:
  push:
    branches:
      - dev-atomica
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev-atomica

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.94.1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  RUST_MIN_STACK: 104857600

jobs:
  guard-selftest:
    name: Zero-test guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - run: .github/scripts/tests/selftest.sh

  crypto-crates:
    name: Crypto Crates Tests
    runs-on: ubuntu-latest
    # The aptos-api step builds most of the node (VM, storage, executor), and the Ethereum header
    # steps build e2e-move-tests and the framework Move unit tests, so a cold cache needs this long.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned, matches rust-toolchain.toml)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            libssl-dev \
            pkg-config \
            libpq-dev \
            lld \
            libudev-dev \
            libdw-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: "crypto-crates"
          cache-on-failure: true
          cache-all-crates: true
          workspaces: "."
          add-job-id-key: false
          # Always save cache to update with newly built artifacts
          save-if: true

      # Every step goes through the guard: a step that runs zero tests fails.
      - name: Run aptos-dkg tests
        run: .github/scripts/run-tests-guarded.sh aptos-dkg 10 -- cargo test -p aptos-dkg --verbose

      - name: Run aptos-crypto tests
        run: .github/scripts/run-tests-guarded.sh aptos-crypto 10 -- cargo test -p aptos-crypto --verbose

      - name: Run aptos-types tests
        run: .github/scripts/run-tests-guarded.sh aptos-types 10 -- cargo test -p aptos-types --verbose

      # Runs even when an earlier crate step fails, so a flake there (such as
      # the randomized aptos-types rounding test) cannot hide these tests.
      # The job still fails if any step failed.
      - name: Run timelock share service tests
        if: ${{ !cancelled() }}
        run: .github/scripts/run-tests-guarded.sh timelock-share-service 8 -- cargo test -p aptos-dkg-runtime --lib timelock_share_service --verbose

      # The timelock DKG session and the TimelockDKGResult handler checks, including
      # the rule that execution reads chain state only (atomica issue 158).
      # The missing-hash check (atomica issue 223) adds two tests.
      - name: Run timelock DKG session tests
        if: ${{ !cancelled() }}
        run: .github/scripts/run-tests-guarded.sh timelock-session 18 -- cargo test -p aptos-dkg-runtime --lib chunky::timelock_session_tests --verbose

      # The Aptos outcome proof golden vectors (atomica issue 201): every accept and reject case
      # verified with production aptos-types code, and regeneration reproduces the checked-in bytes.
      - name: Run Aptos outcome proof vector tests
        if: ${{ !cancelled() }}
        run: .github/scripts/run-tests-guarded.sh atomica-outcome-proof-vectors 6 -- cargo test -p aptos-types --lib atomica_outcome_proof_vectors --verbose

      # The Atomica proof endpoints (atomica issue 201) on an in-process test node: event proof,
      # epoch change proof from the genesis waypoint, 404 for unknown and pruned versions, 400 for
      # a bad event index.
      - name: Run aptos-api atomica_proofs tests
        if: ${{ !cancelled() }}
        run: .github/scripts/run-tests-guarded.sh aptos-api-atomica-proofs 3 -- cargo test -p aptos-api --lib atomica_proofs --verbose

      # Ethereum header attestation (atomica issue 196): certifier and RPC parsing tests.
      - name: Run Ethereum header consensus tests
        if: ${{ !cancelled() }}
        run: .github/scripts/run-tests-guarded.sh eth-header-consensus 8 -- cargo test -p aptos-eth-header-consensus --verbose

      # The ObservedEthHeader handler against the real framework: quorum accepted, and under-quorum,
      # wrong-epoch, wrong-chain-id, forged-signature, conflicting-root and disabled certificates discarded.
      - name: Run ObservedEthHeader VM tests
        if: ${{ !cancelled() }}
        run: '.github/scripts/run-tests-guarded.sh eth-header-vm 7 -- cargo test -p e2e-move-tests --lib eth_header::'

      # One Rust test that runs the ethereum_headers Move unit tests and fails below 8 Move tests.
      - name: Run ethereum_headers Move unit tests
        if: ${{ !cancelled() }}
        run: .github/scripts/run-tests-guarded.sh ethereum-headers-move 1 -- cargo test -p aptos-framework --test move_unit_test -- ethereum_headers

      # One Rust test that runs the ibe_config Move unit tests and fails below the number
      # ibe_config_tests.move holds (atomica issues 230, 226 and 225).
      - name: Run ibe_config Move unit tests
        if: ${{ !cancelled() }}
        run: .github/scripts/run-tests-guarded.sh ibe-config-move 1 -- cargo test -p aptos-framework --test move_unit_test -- ibe_config

      # The genesis tests of aptos-vm-genesis, including the pinned timelock parameters hash
      # (atomica issue 223): genesis writes it, and fails off chain id 4 with the timelock DKG on and no hash.
      - name: Run aptos-vm-genesis tests
        if: ${{ !cancelled() }}
        run: .github/scripts/run-tests-guarded.sh aptos-vm-genesis 1 -- cargo test -p aptos-vm-genesis

      # One Rust test that runs the timelock_dkg Move unit tests and fails below the number
      # timelock_dkg_tests.move holds, including the TimelockKeyMissingEvent tests (atomica issue 231).
      - name: Run timelock_dkg Move unit tests
        if: ${{ !cancelled() }}
        run: .github/scripts/run-tests-guarded.sh timelock-dkg-move 1 -- cargo test -p aptos-framework --test move_unit_test -- timelock_dkg

      # Gas metering of the aptos_std::ibe natives against the real framework (atomica issue 227):
      # metered and deterministic, ibe::decrypt_bid priced per byte above verify_bid_ct, and the
      # largest decrypt batch that fits max_execution_gas. A filter that ends in `::` must be quoted.
      - name: Run ibe gas VM tests
        if: ${{ !cancelled() }}
        run: '.github/scripts/run-tests-guarded.sh ibe-gas 4 -- cargo test -p e2e-move-tests --lib ibe_gas::'

      # One Rust test that runs the ibe_native_test and ibe_golden_vector_tests Move unit tests,
      # including ibe::decrypt_bid (atomica issue 227), and fails below the number the two files hold.
      # The cargo filter is `ibe_bid`: `ibe` alone would also match ibe_config_move_unit_tests.
      - name: Run ibe bid Move unit tests
        if: ${{ !cancelled() }}
        run: .github/scripts/run-tests-guarded.sh ibe-bid-move 1 -- cargo test -p aptos-framework --test move_unit_test -- ibe_bid

      # The TimelockDKGResult handler and the reconfiguration hooks against the real framework (atomica
      # issue 225): a failed session leaves no key, and registration aborts with E_NOT_REGISTRAR (17) before
      # the registrar is set and E_IBE_NOT_READY (2) after. The epoch change of `end_epoch` emits one
      # TimelockKeyMissingEvent for the new epoch (atomica issue 231). A filter that ends in `::` must be quoted.
      - name: Run timelock_dkg VM tests
        if: ${{ !cancelled() }}
        run: '.github/scripts/run-tests-guarded.sh timelock-dkg-vm 4 -- cargo test -p e2e-move-tests --lib timelock_dkg::'

      # The TimelockShare handler through AptosVM against the real framework (atomica issue 229): valid
      # shares stored and revealed, bad shares rejected with an event, malformed points discarded, and the
      # same block giving equal outputs in two fresh harnesses. A filter that ends in `::` must be quoted.
      - name: Run TimelockShare VM tests
        if: ${{ !cancelled() }}
        run: '.github/scripts/run-tests-guarded.sh timelock-share-vm 9 -- cargo test --locked -p e2e-move-tests --lib timelock_share:: -- --test-threads=1'
