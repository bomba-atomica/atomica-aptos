# Atomica Aptos Local Testnet - Debug Configuration
#
# This compose file is for debugging docker image issues.
# It supports testing different images via IMAGE_NAME environment variable.
#
# Usage:
#   IMAGE_NAME=ghcr.io/bomba-atomica/atomica-aptos/validator:latest docker compose up -d
#   IMAGE_NAME=ghcr.io/bomba-atomica/atomica-aptos/validator:PRIOR_SHA docker compose up -d

name: atomica-testnet-debug

services:
  # Validator 0
  validator-0:
    image: "${IMAGE_NAME:-ghcr.io/bomba-atomica/atomica-aptos/validator:latest}"
    container_name: atomica-debug-validator-0
    hostname: validator-0
    user: root
    networks:
      atomica-testnet:
        ipv4_address: 172.19.0.10
    volumes:
      - type: bind
        source: ./genesis-artifacts
        target: /opt/aptos/var/genesis
        read_only: true
      - type: bind
        source: ./validators/validator-0
        target: /opt/aptos/var/identity
        read_only: true
      - type: volume
        source: atomica-debug-validator-0-data
        target: /opt/aptos/var/data
      - type: bind
        source: ./validators/validator-0/node-config.yaml
        target: /opt/aptos/var/etc/node-config.yaml
    command: >
      /usr/local/bin/aptos-node -f /opt/aptos/var/etc/node-config.yaml
    ports:
      - "8080:8080"  # REST API
      - "9101:9101"  # Metrics
    expose:
      - 8080  # REST API
      - 9101  # Metrics
      - 6180  # Validator network
      - 6181  # VFN network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      - RUST_LOG=info,aptos_dkg=debug,consensus=debug,aptos_randomness=debug
      - RUST_BACKTRACE=1

  # Validator 1
  validator-1:
    image: "${IMAGE_NAME:-ghcr.io/bomba-atomica/atomica-aptos/validator:latest}"
    container_name: atomica-debug-validator-1
    hostname: validator-1
    user: root
    depends_on:
      validator-0:
        condition: service_healthy
    networks:
      atomica-testnet:
        ipv4_address: 172.19.0.11
    volumes:
      - type: bind
        source: ./genesis-artifacts
        target: /opt/aptos/var/genesis
        read_only: true
      - type: bind
        source: ./validators/validator-1
        target: /opt/aptos/var/identity
        read_only: true
      - type: volume
        source: atomica-debug-validator-1-data
        target: /opt/aptos/var/data
      - type: bind
        source: ./validators/validator-1/node-config.yaml
        target: /opt/aptos/var/etc/node-config.yaml
    command: >
      /usr/local/bin/aptos-node -f /opt/aptos/var/etc/node-config.yaml
    ports:
      - "8081:8080"  # REST API
      - "9102:9101"  # Metrics
    expose:
      - 8080
      - 9101
      - 6180
      - 6181
    environment:
      - RUST_LOG=info,aptos_dkg=debug,consensus=debug,aptos_randomness=debug
      - RUST_BACKTRACE=1

  # Validator 2
  validator-2:
    image: "${IMAGE_NAME:-ghcr.io/bomba-atomica/atomica-aptos/validator:latest}"
    container_name: atomica-debug-validator-2
    hostname: validator-2
    user: root
    depends_on:
      validator-0:
        condition: service_healthy
    networks:
      atomica-testnet:
        ipv4_address: 172.19.0.12
    volumes:
      - type: bind
        source: ./genesis-artifacts
        target: /opt/aptos/var/genesis
        read_only: true
      - type: bind
        source: ./validators/validator-2
        target: /opt/aptos/var/identity
        read_only: true
      - type: volume
        source: atomica-debug-validator-2-data
        target: /opt/aptos/var/data
      - type: bind
        source: ./validators/validator-2/node-config.yaml
        target: /opt/aptos/var/etc/node-config.yaml
    command: >
      /usr/local/bin/aptos-node -f /opt/aptos/var/etc/node-config.yaml
    ports:
      - "8082:8080"  # REST API
      - "9103:9101"  # Metrics
    expose:
      - 8080
      - 9101
      - 6180
      - 6181
    environment:
      - RUST_LOG=info,aptos_dkg=debug,consensus=debug,aptos_randomness=debug
      - RUST_BACKTRACE=1

  # Validator 3
  validator-3:
    image: "${IMAGE_NAME:-ghcr.io/bomba-atomica/atomica-aptos/validator:latest}"
    container_name: atomica-debug-validator-3
    hostname: validator-3
    user: root
    depends_on:
      validator-0:
        condition: service_healthy
    networks:
      atomica-testnet:
        ipv4_address: 172.19.0.13
    volumes:
      - type: bind
        source: ./genesis-artifacts
        target: /opt/aptos/var/genesis
        read_only: true
      - type: bind
        source: ./validators/validator-3
        target: /opt/aptos/var/identity
        read_only: true
      - type: volume
        source: atomica-debug-validator-3-data
        target: /opt/aptos/var/data
      - type: bind
        source: ./validators/validator-3/node-config.yaml
        target: /opt/aptos/var/etc/node-config.yaml
    command: >
      /usr/local/bin/aptos-node -f /opt/aptos/var/etc/node-config.yaml
    ports:
      - "8083:8080"  # REST API
      - "9104:9101"  # Metrics
    expose:
      - 8080
      - 9101
      - 6180
      - 6181
    environment:
      - RUST_LOG=info,aptos_dkg=debug,consensus=debug,aptos_randomness=debug
      - RUST_BACKTRACE=1

networks:
  atomica-testnet:
    name: atomica-testnet-debug
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1

volumes:
  atomica-debug-validator-0-data:
    name: atomica-debug-validator-0-data
  atomica-debug-validator-1-data:
    name: atomica-debug-validator-1-data
  atomica-debug-validator-2-data:
    name: atomica-debug-validator-2-data
  atomica-debug-validator-3-data:
    name: atomica-debug-validator-3-data
